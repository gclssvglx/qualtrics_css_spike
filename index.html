<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qualtrics HTML/CSS Spike</title>

  <!-- <link rel="stylesheet" type="text/css" href="css-variables.css"> -->
  <!-- <link rel="stylesheet" type="text/css" href="example-stylesheet.css"> -->
</head>

<body>
  <div id="q" style="display: none;"></div>
  <div id="root">
    <div id="app">
      <div data-testid="page-ready" id="page">
        <header>
          <div class="empty" id="header-container"></div>
        </header>
        <main class="" id="survey-canvas">
          <div id="canvas-heading"></div>
          <div style="display: contents;">
            <section class="transition-none transition-forward" id="contents" style="height: auto;">
              <div class="">
                <div class="transition-content transition-entered" id="content-1">
                  <div class="content">
                    <div></div>
                    <section class="question mc vertical" id="question-QID1">
                      <div class="question-error-wrapper">
                        <div>
                          <div class="overflow-container shadowbox">
                            <div class="overflow-content shadowbox-inner">
                              <div class="question-display-wrapper" id="question-display-wrapper-QID1" tabindex="-1">
                                <div class="question-display rich-text" id="question-display-QID1">Multiple choice - one
                                  answer</div>
                              </div>
                              <div class="question-content">
                                <div class="mc-content">
                                  <div aria-labelledby="question-display-QID1" class="choices" role="radiogroup">
                                    <div class="choice radio">
                                      <div class="choice-error-container">
                                        <div class="choice-error"><label class="choice-label"
                                            for="mc-choice-input-QID1-1"><input aria-describedby="" aria-invalid="false"
                                              aria-labelledby="choice-display-QID1-1" id="mc-choice-input-QID1-1"
                                              name="QID1" role="radio" type="radio"><span
                                              class="radio-button radio"></span><span class="choice-content"><span
                                                class="display-with-image" id="choice-display-QID1-1"><span
                                                  class="display-with-image-display rich-text">One</span></span></span></label>
                                        </div>
                                      </div>
                                    </div>
                                    <div class="choice radio">
                                      <div class="choice-error-container">
                                        <div class="choice-error"><label class="choice-label"
                                            for="mc-choice-input-QID1-2"><input aria-describedby="" aria-invalid="false"
                                              aria-labelledby="choice-display-QID1-2" id="mc-choice-input-QID1-2"
                                              name="QID1" role="radio" type="radio"><span
                                              class="radio-button radio"></span><span class="choice-content"><span
                                                class="display-with-image" id="choice-display-QID1-2"><span
                                                  class="display-with-image-display rich-text">Two</span></span></span></label>
                                        </div>
                                      </div>
                                    </div>
                                    <div class="choice radio">
                                      <div class="choice-error-container">
                                        <div class="choice-error"><label class="choice-label"
                                            for="mc-choice-input-QID1-3"><input aria-describedby="" aria-invalid="false"
                                              aria-labelledby="choice-display-QID1-3" id="mc-choice-input-QID1-3"
                                              name="QID1" role="radio" type="radio"><span
                                              class="radio-button radio"></span><span class="choice-content"><span
                                                class="display-with-image" id="choice-display-QID1-3"><span
                                                  class="display-with-image-display rich-text">Three</span></span></span></label>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>
                    <section class="question mc vertical" id="question-QID2">
                      <div class="question-error-wrapper">
                        <div>
                          <div class="overflow-container shadowbox">
                            <div class="overflow-content shadowbox-inner">
                              <div class="question-display-wrapper" id="question-display-wrapper-QID2" tabindex="-1">
                                <div class="question-display rich-text" id="question-display-QID2">Multiple choice -
                                  multiple answers</div>
                              </div>
                              <div class="question-content">
                                <div class="mc-content">
                                  <div aria-labelledby="question-display-QID2" class="choices" role="group">
                                    <div class="choice checkbox">
                                      <div class="choice-error-container">
                                        <div class="choice-error"><label class="choice-label"
                                            for="mc-choice-input-QID2-1"><input aria-describedby="" aria-invalid="false"
                                              aria-labelledby="choice-display-QID2-1" id="mc-choice-input-QID2-1"
                                              name="QID2" role="checkbox" type="checkbox"><span
                                              class="radio-button checkbox"></span><span class="choice-content"><span
                                                class="display-with-image" id="choice-display-QID2-1"><span
                                                  class="display-with-image-display rich-text">One</span></span></span></label>
                                        </div>
                                      </div>
                                    </div>
                                    <div class="choice checkbox">
                                      <div class="choice-error-container">
                                        <div class="choice-error"><label class="choice-label"
                                            for="mc-choice-input-QID2-2"><input aria-describedby="" aria-invalid="false"
                                              aria-labelledby="choice-display-QID2-2" id="mc-choice-input-QID2-2"
                                              name="QID2" role="checkbox" type="checkbox"><span
                                              class="radio-button checkbox"></span><span class="choice-content"><span
                                                class="display-with-image" id="choice-display-QID2-2"><span
                                                  class="display-with-image-display rich-text">Two</span></span></span></label>
                                        </div>
                                      </div>
                                    </div>
                                    <div class="choice checkbox">
                                      <div class="choice-error-container">
                                        <div class="choice-error"><label class="choice-label"
                                            for="mc-choice-input-QID2-3"><input aria-describedby="" aria-invalid="false"
                                              aria-labelledby="choice-display-QID2-3" id="mc-choice-input-QID2-3"
                                              name="QID2" role="checkbox" type="checkbox"><span
                                              class="radio-button checkbox"></span><span class="choice-content"><span
                                                class="display-with-image" id="choice-display-QID2-3"><span
                                                  class="display-with-image-display rich-text">Three</span></span></span></label>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>
                    <section class="question mc select" id="question-QID3">
                      <div class="question-error-wrapper">
                        <div>
                          <div class="overflow-container shadowbox">
                            <div class="overflow-content shadowbox-inner">
                              <div class="question-display-wrapper" id="question-display-wrapper-QID3" tabindex="-1">
                                <div class="question-display rich-text" id="question-display-QID3">Multiple choice -
                                  select
                                  - one answer</div>
                              </div>
                              <div class="question-content">
                                <div class="mc-content"><select size="6" aria-invalid="false"
                                    aria-labelledby="question-display-wrapper-QID3" aria-required="false">
                                    <option value="1">One</option>
                                    <option value="2">Two</option>
                                    <option value="3">Three</option>
                                  </select></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>
                    <section class="question mc select" id="question-QID5">
                      <div class="question-error-wrapper">
                        <div>
                          <div class="overflow-container shadowbox">
                            <div class="overflow-content shadowbox-inner">
                              <div class="question-display-wrapper" id="question-display-wrapper-QID5" tabindex="-1">
                                <div class="question-display rich-text" id="question-display-QID5">Multiple choice -
                                  select
                                  - multiple answers</div>
                              </div>
                              <div class="question-content">
                                <div class="mc-content"><select multiple="" aria-invalid="false"
                                    aria-labelledby="question-display-wrapper-QID5" aria-required="false" size="6">
                                    <option value="1">One</option>
                                    <option value="2">Two</option>
                                    <option value="3">Three</option>
                                  </select></div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>
                  </div>
                </div>
              </div>
            </section>
            <div>
              <nav id="navigation">
                <div id="secondary-navigation"></div>
                <div id="primary-navigation">
                  <button aria-label="Next page" class="navigation-button" id="next-button" type="button">
                    <span>
                      <a href="page-2.html">Next page</a>
                    </span>
                    <svg aria-hidden="true" data-icontype="ChevronRight" height="1.5rem" viewBox="0 0 24 24"
                      width="1.5rem" xmlns="http://www.w3.org/2000/svg">
                      <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M9.97032 17.0297C9.67707 16.7378 9.67649 16.2641 9.96903 15.9715L13.9402 12L9.96903 8.0284C9.67649 7.73584 9.67707 7.26208 9.97032 6.97022C10.2636 6.67837 10.7384 6.67895 11.031 6.97151L15.3182 11.2591C15.5149 11.4558 15.6255 11.7225 15.6255 12C15.6255 12.2774 15.5153 12.5438 15.3186 12.7404L11.031 17.0284C10.7384 17.321 10.2636 17.3215 9.97032 17.0297Z">
                      </path>
                    </svg>
                  </button>
                </div>
              </nav>
            </div>
          </div>
        </main>
        <footer>
          <div class="plug-container">
            <div id="plug">
              <a aria-label="Powered by Qualtrics Open in a new tab" href="" rel="noopener" target="_blank">Powered by
                Qualtrics
                <svg aria-hidden="false" data-icontype="ExternalLink" height="1rem" viewBox="0 0 24 24" width="1rem"
                  xmlns="http://www.w3.org/2000/svg">
                  <title>Open in a new tab</title>
                  <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M14.25 4C14.25 3.58579 14.5858 3.25 15 3.25H20C20.4142 3.25 20.75 3.58579 20.75 4V9C20.75 9.41421 20.4142 9.75 20 9.75C19.5858 9.75 19.25 9.41421 19.25 9V5.81066L13.0303 12.0303C12.7374 12.3232 12.2626 12.3232 11.9697 12.0303C11.6768 11.7374 11.6768 11.2626 11.9697 10.9697L18.1893 4.75H15C14.5858 4.75 14.25 4.41421 14.25 4ZM3.25 7C3.25 6.0335 4.0335 5.25 5 5.25H10.5C10.9142 5.25 11.25 5.58579 11.25 6C11.25 6.41421 10.9142 6.75 10.5 6.75H5C4.86193 6.75 4.75 6.86193 4.75 7V19C4.75 19.1381 4.86193 19.25 5 19.25H17C17.1381 19.25 17.25 19.1381 17.25 19V13.5C17.25 13.0858 17.5858 12.75 18 12.75C18.4142 12.75 18.75 13.0858 18.75 13.5V19C18.75 19.9665 17.9665 20.75 17 20.75H5C4.0335 20.75 3.25 19.9665 3.25 19V7Z">
                  </path>
                </svg>
              </a>
            </div>
          </div>
        </footer>
      </div>
    </div>
  </div>
</body>

</html>
